[package]
name = "terminal-video-player"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Windows-first terminal media player proof of concept"
license = "MIT"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "unicode",
] }
crossbeam-channel = "=0.5.16"
crossterm = { version = "=0.29.0", default-features = false, features = [
    "events",
    "windows",
] }
ctrlc = "=3.5.2"
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
unicode-width = { version = "=0.2.2", default-features = false }

[target.'cfg(windows)'.dependencies]
cpal = { version = "=0.18.1", default-features = false }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }
tempfile = "=3.27.0"

[[bench]]
name = "render"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
